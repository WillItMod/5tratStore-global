id: kraskus-btc-blake2b-solo
name: XBT by Kraskus
tagline: XBT BLAKE2b node and solo mining
description: Run the XBT BLAKE2b fork with its own consensus and coinbase-maturity rules. This is
  a separate network from Bitcoin SHA-256. Connect compatible miners on TCP 1923. Mining starts paused
  until you configure an external reward address and the node is ready. The fixed 1% developer fee
  is included in the coinbase. Requires an x86-64 (amd64) host; ARM is not supported by this release.
  Initial chain synchronization uses disk, memory and bandwidth. Kraskus Pool forwarding is not available
  in these submitted releases. Existing wallet and recovery data must be backed up and preserved
  when switching from a native-wallet version; this app does not expose native-wallet controls or
  automatically sweep funds.
version: 0.3.4
category: Mining
developer: Kraskus Crypto / 4KM Ventures LLC
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Release-Sources
support: https://kraskuscrypto.com/
port: 33066
path: /
uiMode: proxy
icon: icon.svg
architectures:
- amd64
dependencies: []
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
