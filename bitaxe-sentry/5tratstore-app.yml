id: bitaxe-sentry
name: Bitaxe Sentry
tagline: Monitor Bitaxe miners from a local dashboard
description: >-
  Bitaxe Sentry is the upstream monitoring dashboard for Bitaxe miners. Add only
  miner addresses that you administer to track hashrate, temperature, voltage
  and history, and optionally configure your own Discord webhook for alerts.
  It does not mine, change firmware or hold funds. This recipe builds the
  upstream Dockerfile locally from the reviewed commit, keeps its database in
  managed app data, and exposes the dashboard only through 5tratumOS.
version: 0.8.0
category: Mining
