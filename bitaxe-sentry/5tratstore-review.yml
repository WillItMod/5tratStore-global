notes: >-
  HOLD pending an upstream reproducible artifact and a credential-logging fix.
  Upstream v0.8.0 logs the submitted settings dictionary, including a configured
  Discord webhook URL, and must not be approved with that feature exposed. The
  user's node builds
  the upstream Dockerfile from the full reviewed commit. No upstream source or
  application image is carried by the store. The two containers share only the
  managed application database and do not receive host, device or Docker access.
  The upstream Dockerfile floats its Python base and every Python requirement,
  so the same commit can build different contents. The UI loads Bootstrap
  assets from jsDelivr. Install, rendered UI, restart persistence, source
  rebuild/update, managed SQLite backup and restore, and clean uninstall passed
  on the amd64 Proxmox StratumOS test guest without configuring miners or a
  Discord webhook. That lifecycle result does not resolve the reproducibility
  or credential-logging blockers.
