services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 3001
  app:
    image: louislam/uptime-kuma:2.4.0@sha256:91e963bfda569ba115206e843febb446f473ab525add4e08b2b9e3beffa16985
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      TZ: UTC
    security_opt:
      - no-new-privileges:true
