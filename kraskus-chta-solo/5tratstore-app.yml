id: kraskus-chta-solo
name: CheetahCoin by Kraskus
tagline: CheetahCoin node with two solo mining lanes
description: Run CheetahCoin Core with a solo mining dashboard. Standard miners connect on TCP 1926;
  very low hash rate miners use TCP 1927. Confirm your external CHTA reward address and explicitly
  start mining after the node is ready. The existing coinbase allocation retains a fixed 1% developer
  fee. Requires an x86-64 (amd64) host; ARM is not supported by this release. Initial chain synchronization
  uses disk, memory and bandwidth. Kraskus Pool forwarding is not available in these submitted releases.
  Existing wallet and recovery data must be backed up and preserved when switching from a native-wallet
  version; this app does not expose native-wallet controls or automatically sweep funds.
version: 0.6.3
category: Mining
developer: Kraskus Crypto / 4KM Ventures LLC
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Release-Sources
support: https://kraskuscrypto.com/
port: 33064
path: /
uiMode: proxy
icon: icon.svg
architectures:
- amd64
dependencies: []
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
