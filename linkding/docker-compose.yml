services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 9090
  app:
    image: sissbruecker/linkding:1.45.0@sha256:61b2eb9eed8e5772a473fb7f1f8923e046cb8cbbeb50e88150afd5ff287d4060
    restart: unless-stopped
    ports:
      - 127.0.0.1:33040:9090
    environment:
      LD_SUPERUSER_NAME: 5tratum
      LD_SUPERUSER_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/etc/linkding/data
    security_opt: [no-new-privileges:true]
