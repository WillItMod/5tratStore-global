notes: >-
  Official linkding image pinned to an immutable digest. It is intentionally
  the upstream basic image rather than the larger browser-archive variant. The
  initial upstream superuser feature uses the locally chosen app password; no
  credentials leave the node. Its upstream entrypoint needs its normal
  initial root-to-service-user setup, so capabilities are not forcibly dropped;
  no extra capabilities are added. No host mounts, device access, Docker
  socket, privileged mode or host networking are used. The icon and gallery are
  direct original upstream assets.
