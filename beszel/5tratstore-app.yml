id: beszel
name: Beszel Hub
tagline: Lightweight monitoring for systems you enrol
description: >-
  Beszel is a lightweight monitoring hub with historical data and alerts. This
  recipe installs only the original Hub interface. It has no access to the
  5tratumOS host or Docker daemon; add monitoring agents or remote systems
  yourself after creating the administrator account.
version: 0.18.7
