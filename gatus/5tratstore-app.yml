id: gatus
name: Gatus
tagline: Automated service health dashboard
description: >-
  Gatus is an open-source, developer-oriented status page and alerting service.
  It monitors HTTP endpoints and displays their health history. The initial
  configuration checks the application's own health endpoint only; users add
  their own services explicitly.
