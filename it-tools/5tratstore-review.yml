notes: >-
  HOLD. The 2024 stable image passed local arm64 and Proxmox StratumOS amd64
  Compose lifecycles, including start, rendered UI, restart, digest re-pull and
  clean uninstall, but is not releasable. A Trivy 0.72.0 scan on 2026-08-01
  reported 38 fixable operating
  system package findings at high or critical severity (35 high and 3 critical)
  and identified its Alpine 3.20 base as end-of-support. There is no persistent
  server data, so backup and restore are not applicable. The recipe pulls the exact
  multi-architecture image published by the upstream repository's release
  workflow and pinned to its immutable manifest digest. The app has no host
  mounts, persistent server data, device access, Docker socket, privileged mode
  or host networking. All Linux capabilities are dropped except the four needed
  by the upstream Nginx entrypoint to prepare cache ownership, bind port 80 and
  switch its workers to the nginx user. The tagged upstream icon and banner
  remain direct links; the store does not copy them.
