[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  flush_interval = "30s"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.system]]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "2m"
