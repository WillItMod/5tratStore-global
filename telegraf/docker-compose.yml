services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 9273
  app:
    image: telegraf:1.39.2@sha256:49899960eccad39415b91cf654324f0bb7efddaef8f1aa3ec24e2d8c6e19618e
    user: "999:999"
    restart: unless-stopped
    ports:
      - 127.0.0.1:33021:9273
    volumes:
      - ${APP_DATA_DIR}/data/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
