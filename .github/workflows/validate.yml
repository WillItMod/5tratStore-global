name: Validate 5tratStore

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - run: python -m unittest scripts/test_validate_store.py
      - name: Validate draft candidates
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: python scripts/validate_store.py --allow-pending
      - name: Validate release catalogue
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: python scripts/validate_store.py
