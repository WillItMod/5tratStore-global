id: kraskus-bsv-solo
name: Bitcoin SV by Kraskus
tagline: Bitcoin SV node and solo mining
description: Run an SV Node 1.2.2 node and a solo Stratum service on TCP 1922. Mining starts paused
  until you set an external BSV reward address and the node is ready. A fixed 1% developer fee is
  allocated in the coinbase. The node makes outbound peer connections; Bitcoin's standard inbound
  peer port is not published. Requires an x86-64 (amd64) host; ARM is not supported by this release.
  Initial chain synchronization uses disk, memory and bandwidth. Kraskus Pool forwarding is not available
  in these submitted releases. Existing wallet and recovery data must be backed up and preserved
  when switching from a native-wallet version; this app does not expose native-wallet controls or
  automatically sweep funds.
version: 0.6.4
category: Mining
developer: Kraskus Crypto / 4KM Ventures LLC
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Release-Sources
support: https://kraskuscrypto.com/
port: 18422
path: /
uiMode: proxy
icon: icon.svg
architectures:
- amd64
dependencies: []
services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
