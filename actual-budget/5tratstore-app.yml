id: actual-budget
name: Actual Budget
tagline: Local-first personal finance software
description: >-
  Actual Budget is original upstream local-first personal finance software with
  optional synchronisation between your devices. This recipe stores its server
  data in managed app storage and lets the administrator create their own
  account during onboarding. It is not a cryptocurrency wallet, does not manage
  private keys, and must not be treated as a substitute for wallet backups.
  Back up its data before upgrades or removal.
