services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 5006
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        install -d -m 700 -o 1001 -g 1001 /data &&
        chown -R 1001:1001 /data &&
        find /data -maxdepth 1 -type f -exec chmod 600 {} \;
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt: [no-new-privileges:true]
  app:
    image: actualbudget/actual-server:26.7.0@sha256:e18b7fbfec6157a368fad4146563f397502e9da70a120aeaeac63b4977405d1c
    user: "1001:1001"
    restart: unless-stopped
    ports:
      - 127.0.0.1:33041:5006
    volumes:
      - ${APP_DATA_DIR}/data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      init:
        condition: service_completed_successfully
