id: node-red
name: Node-RED
tagline: Automate miner telemetry, alerts, and control workflows
description: >-
  Node-RED is a low-code, event-driven automation tool. Use it to connect miner
  APIs, MQTT telemetry, monitoring services, notifications, and other local or
  remote endpoints into operator-defined flows. This independent 5tratStore
  recipe keeps the editor behind the authenticated 5tratumOS proxy and does
  not expose it directly to the LAN. No affiliation or endorsement is implied.
version: 5.0.4
category: Mining automation
developer: OpenJS Foundation and Node-RED contributors
website: https://nodered.org/
repo: https://github.com/node-red/node-red
support: https://github.com/node-red/node-red/issues
port: 33015
path: /
uiMode: proxy
services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 1880
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - install -d -o 1000 -g 1000 /data && chown -R 1000:1000 /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
  app:
    image: nodered/node-red:5.0.4-24@sha256:10f40d0a83e7e5852b13d4d472b2006b05b1cca6d55e2f29a55a12c25a630cb6
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - 127.0.0.1:33015:1880
    environment:
      TZ: UTC
      NODE_RED_ENABLE_PROJECTS: "false"
      NODE_RED_ENABLE_SAFE_MODE: "false"
      NODE_RED_CREDENTIAL_SECRET: ${APP_PASSWORD}
      NODE_OPTIONS: --max_old_space_size=256
    volumes:
      - ${APP_DATA_DIR}/data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1880/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
