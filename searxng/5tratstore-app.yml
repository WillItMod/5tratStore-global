id: searxng
name: SearXNG
tagline: Privacy-respecting metasearch engine
description: >-
  SearXNG is a self-hosted metasearch engine. This recipe runs the original
  upstream container and stores its configuration and cache in managed app
  storage. Search queries are sent to the search providers enabled in SearXNG;
  self-hosting improves control, but is not anonymity. Review the provider list
  and privacy settings before using it with sensitive searches.
