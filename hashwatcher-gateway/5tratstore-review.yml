notes: >-
  On 2026-08-01 Gabe, the HashWatcher project developer, gave the 5tratumOS
  owner permission to integrate this guided setup. It is deliberately described
  as a guided HashWatcher remote-monitoring setup, not as a HashWatcher
  companion app or an Engineered Essentials product. The original, pinned
  upstream image is pulled directly to the user's node; 5tratStore does not
  host, mirror, alter or redistribute it. The recipe runs the unmodified
  upstream image and uses SIGINT for clean shutdown. Clean install, start,
  health, direct-LAN refusal, authenticated-proxy routing, persistent
  configuration, pinned update, uninstall/reinstall and clean shutdown passed
  on the amd64 Proxmox 5tratumOS v0.7.4 release candidate. The app was disabled
  after verification. A real tailnet route, a supported-miner test, arm64
  runtime verification and independent Sol/high review remain post-publication
  checks.
