services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 8787
  app:
    image: hashwatcher/hashwatcher-gateway:1.3.0@sha256:13af6f24a4e73b84ed173df90fd1489257316fbc433381f69dd9ed262645c9ef
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - 127.0.0.1:33014:8787
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /proc/1/net:/host_proc_net:ro
    environment:
      PI_HOSTNAME: HashWatcherGateway
      AGENT_ID: hashwatcher-gateway
      HOST_IP: ""
      BITAXE_HOST: ""
      BITAXE_SCHEME: http
      BITAXE_ENDPOINTS: /system/info,/api/system/info
      POLL_SECONDS: 10
      HTTP_TIMEOUT_SECONDS: 5
      STATUS_HTTP_BIND: 0.0.0.0
      STATUS_HTTP_PORT: 8787
      RUNTIME_CONFIG_PATH: /data/runtime_config.json
      LAST_WIFI_PATH: /data/last_wifi_credentials.json
    security_opt:
      - no-new-privileges:true
