id: hashwatcher-gateway
name: HashWatcher Remote Monitoring Setup
tagline: Guided private access to ASIC miners through Tailscale
description: >-
  This guided setup installs the HashWatcher Gateway helper so a user can make
  ASIC miners reachable to their own HashWatcher companion app through their
  own Tailscale network. It is not the HashWatcher companion app and does not
  include a HashWatcher subscription. The local setup interface is kept behind
  the authenticated 5tratumOS proxy and is not exposed directly to the LAN.
version: 1.3.0
category: Mining
developer: Engineered Essentials
website: https://hashwatcher.app/
repo: https://github.com/gpena208777/hashwatcherhub
support: https://hashwatcher.app/support
port: 33014
path: /
uiMode: proxy
services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 8787
  init:
    image: hashwatcher/hashwatcher-gateway:1.3.0@sha256:13af6f24a4e73b84ed173df90fd1489257316fbc433381f69dd9ed262645c9ef
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |-
        set -eu
        temporary=/data/5tratstore-hub-agent.py.tmp
        target=/data/5tratstore-hub-agent.py
        cp /app/hub_agent.py "$${temporary}"
        sed -i 's/self.config_lock = threading.Lock()/self.config_lock = threading.RLock()/' "$${temporary}"
        sed -i '/server = ThreadingHTTPServer/a\        server.daemon_threads = True' "$${temporary}"
        grep -q 'self.config_lock = threading.RLock()' "$${temporary}"
        grep -q 'server.daemon_threads = True' "$${temporary}"
        chmod 0444 "$${temporary}"
        mv -f "$${temporary}" "$${target}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
  app:
    image: hashwatcher/hashwatcher-gateway:1.3.0@sha256:13af6f24a4e73b84ed173df90fd1489257316fbc433381f69dd9ed262645c9ef
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - 127.0.0.1:33014:8787
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/5tratstore-hub-agent.py:/app/hub_agent.py:ro
      - /proc/1/net:/host_proc_net:ro
    environment:
      PI_HOSTNAME: HashWatcherGateway
      AGENT_ID: hashwatcher-gateway
      HOST_IP: ""
      BITAXE_HOST: ""
      BITAXE_SCHEME: http
      BITAXE_ENDPOINTS: /system/info,/api/system/info
      POLL_SECONDS: 10
      HTTP_TIMEOUT_SECONDS: 5
      STATUS_HTTP_BIND: 0.0.0.0
      STATUS_HTTP_PORT: 8787
      RUNTIME_CONFIG_PATH: /data/runtime_config.json
      LAST_WIFI_PATH: /data/last_wifi_credentials.json
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
