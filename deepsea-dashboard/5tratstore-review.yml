notes: >-
  HOLD pending an upstream reproducible artifact and dependency security fix.
  The user's node builds
  the upstream Dockerfile from the full reviewed commit. No upstream source or
  application image is carried by the store. Managed mounts contain only the
  app's settings and database; Redis is an ephemeral project-network-only
  cache whose non-user internal password may appear in upstream startup logs.
  The upstream Dockerfile floats base images, package-manager inputs and Python
  minimum-version constraints, so the same commit can build different contents.
  Its reviewed production frontend dependencies also contain React Router open
  redirect/XSS advisories. Proxmox lifecycle and backup/restore tests remain
  required after those blockers are resolved.
