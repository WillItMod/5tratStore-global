notes: >-
  The original Prometheus image is pulled directly by the user's node. The
  recipe contains only original 5tratStore configuration and an isolated test
  capture of the unmodified upstream UI.
  The safe default config has a local discard receiver, so it sends no alert or
  credentials to an external service. The app runs as the image's nobody user,
  has all Linux capabilities dropped, has no host mounts, devices, privileged
  mode, host networking or Docker socket, and its UI binds to host loopback.
  Clean install, start, readiness access, pinned update, data-preserving
  uninstall/reinstall and disable are verified on the amd64 Proxmox 5tratumOS
  v0.7.4 release candidate. The test app was disabled after verification.
