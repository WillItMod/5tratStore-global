id: arkade-wallet
name: Arkade Wallet
tagline: Self-custodial Bitcoin wallet for the Ark protocol
description: >-
  Arkade Wallet is the upstream open-source Bitcoin progressive web app for
  creating and managing on-chain UTXOs and Ark VTXOs. Wallet keys and recovery
  material are held in the user's browser, not by 5tratumOS. By default the app
  connects to Ark Labs' public Arkade services; those operators can observe
  network requests and their own terms apply. Treat this as custody-sensitive
  software: use HTTPS, record the recovery material offline, test with a small
  amount first, and do not assume the node filesystem is a wallet backup.
