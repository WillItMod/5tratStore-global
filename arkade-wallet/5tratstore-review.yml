notes: >-
  HOLD. Arkade stores custody-sensitive wallet material in browser storage, but
  the current 5tratumOS proxy does not provide a unique secure origin per app.
  Do not approve until that isolation exists and recovery/restore is tested.
  The reviewed upstream dependency tree also contains a high-severity ws
  memory-exhaustion advisory fixed in ws 8.21.0. Direct upstream
  multi-architecture image, no host mounts or persistent container data. The
  default external Ark ecosystem services, HTTPS requirement, recovery
  responsibility and funds risk are disclosed. Its install, rendered UI,
  restart, pinned-image re-pull/update and clean uninstall passed on the amd64
  Proxmox StratumOS test guest; that lifecycle result does not resolve the
  secure-origin or wallet-recovery blockers.
