services:
  app_proxy:
    environment:
      APP_HOST: nodeui-proxy
      APP_PORT: 80

  mysterium:
    image: mysteriumnetwork/myst:1.38.5-alpine@sha256:49c6381a3efaa11c2ad9728df3c88bd2df6e061882f83e4983677eb90ee717c2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - service
      - --agreed-terms-and-conditions
    volumes:
      - ${APP_DATA_DIR}/data/mysterium:/var/lib/mysterium-node

  nodeui-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/nodeui-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mysterium
