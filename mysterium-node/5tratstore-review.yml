notes: >-
  Original 5tratStore recipe prepared directly from the upstream Mysterium Node
  project and official Mysterium Docker image. Upstream Docker documentation
  requires host networking so the provider can detect and publish the correct
  service IP and requires NET_ADMIN for network operation. The provider is
  launched with Mysterium's --agreed-terms-and-conditions flag. Persistent state
  is limited to ${APP_DATA_DIR}/data/mysterium. A pinned official nginx helper
  proxies the upstream local Node UI from host port 4449 into the 5tratumOS app
  proxy. The catalogue icon is original trademark-neutral artwork and contains
  no Mysterium, Kraskus, or 5tratumOS marks. Legal/provenance clearance,
  endpoint review, lifecycle testing, and final approval remain for the
  5tratStore maintainers.
