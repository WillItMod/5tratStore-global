id: mysterium-node
name: Mysterium Node
tagline: Run the official Mysterium Network provider node
description: >-
  Mysterium Node is the official provider-node software for the Mysterium
  Network. This recipe pulls the pinned official upstream container directly
  from Mysterium Network and stores node identity and runtime state in
  persistent 5tratumOS application data. The upstream local Node UI is exposed
  through a small pinned nginx proxy for access inside 5tratumOS. Mysterium's
  upstream Docker instructions require host networking, NET_ADMIN, and explicit
  acceptance of the provider terms. Running a provider node may route
  third-party traffic through the host's public IP; users should review the
  upstream terms and applicable local requirements before installation.
version: 1.38.5
category: Networking
developer: Mysterium Network
website: https://www.mysterium.network/
repo: https://github.com/mysteriumnetwork/node
support: https://github.com/mysteriumnetwork/node/issues
port: 33060
path: /
services:
  app_proxy:
    environment:
      APP_HOST: nodeui-proxy
      APP_PORT: 80
  mysterium:
    image: mysteriumnetwork/myst:1.38.5-alpine@sha256:49c6381a3efaa11c2ad9728df3c88bd2df6e061882f83e4983677eb90ee717c2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - service
      - --agreed-terms-and-conditions
    volumes:
      - ${APP_DATA_DIR}/data/mysterium:/var/lib/mysterium-node
  nodeui-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/nodeui-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mysterium
