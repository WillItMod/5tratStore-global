services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 9090
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - install -d -o 1000 -g 1000 /prometheus && chown -R 1000:1000 /prometheus
    volumes:
      - ${APP_DATA_DIR}/data/storage:/prometheus
    security_opt:
      - no-new-privileges:true
  app:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    restart: unless-stopped
    user: "1000:1000"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ${APP_DATA_DIR}/data/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${APP_DATA_DIR}/data/storage:/prometheus
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
