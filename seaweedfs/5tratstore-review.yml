notes: >-
  Official SeaweedFS image from the project maintainer's documented Docker Hub
  repository, pinned to an immutable digest. The upstream mini command creates
  a single-node S3 endpoint with explicit credentials and a pre-created local
  bucket. The S3 endpoint is loopback-bound; only the master console is passed
  to the authenticated 5tratumOS proxy. No host mounts, device access, Docker
  socket, privileged mode or host networking are used. The upstream entrypoint
  needs its normal bootstrap-to-service-user privilege drop, so capabilities
  are not forcibly removed and no extra capabilities are added. The upstream
  favicon is linked directly.
