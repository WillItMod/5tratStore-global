notes: 'Verified on the amd64 5tratumOS 0.8.19 node. The logged-in node was reachable through its Tailscale
  IP: the OS returned its authenticated login route and MUX returned HTTP 200. The user independently
  confirmed remote access. Container removal/recreation and daemon restart retained the node identity
  and IP without reauthentication. Persistent state was backed up. Initializer tests verified fresh setup,
  legacy identity copying, source retention and no overwrite of a current identity. The daemon now uses
  host networking, NET_ADMIN, NET_RAW and /dev/net/tun to provide node access. The setup service remains
  loopback-only behind OS authentication. DNS acceptance, route acceptance, Tailscale SSH and advertised
  subnet routes remain off by default. TS_AUTH_ONCE preserves login; TS_BOOT_TIMEOUT allows 24 hours for
  first-time browser authentication instead of restarting every minute. The official PNG favicon is included
  unchanged as a local identification asset so Orbit texture loading stays within the OS same-origin connection
  policy. The same local asset serves store and desktop views. Repeated normal store updates retain the
  running daemon control socket; init no longer unlinks it. Arm64 runtime support is not claimed.'
