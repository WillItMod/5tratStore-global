notes: >-
  Lifecycle-tested on the Proxmox 5tratumOS amd64 test system. Install, start, update,
  uninstall-with-data-retained, reinstall, restart, state persistence and clean
  shutdown passed. The management UI returned HTTP 200 locally, direct LAN
  access was refused, the unauthenticated OS route redirected to login, and port
  33016 closed after disable. The persistent identity-state SHA-256 remained
  3b7ff5892070c77e026df45b8fce43946cae4fbac2eb78c07e5dc4da1df93ea3
  across the lifecycle. Userspace mode deliberately avoids privileged mode,
  NET_ADMIN, host networking and /dev/net/tun. A user must authenticate their
  own Tailscale account before it can join a tailnet. Arm64 runtime verification
  and independent Sol/high review remain tracked follow-up work. The app was
  disabled after verification.
