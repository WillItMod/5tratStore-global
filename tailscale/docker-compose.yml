services:
  app_proxy:
    environment:
      APP_HOST: web
      APP_PORT: 5252
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: 'no'
    user: 0:0
    command:
    - sh
    - -ec
    - |-
      mkdir -p /data/state /data/run
      if [ ! -f /data/state/tailscaled.state ] && [ -f /data/tailscale/tailscaled.state ]; then
        cp -a /data/tailscale/. /data/state/
      fi
      chown -R 0:0 /data/state /data/run
      chmod 700 /data/state /data/run
    volumes:
    - ${APP_DATA_DIR}/data:/data
    security_opt:
    - no-new-privileges:true
  daemon:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    restart: unless-stopped
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: 'false'
      TS_ACCEPT_DNS: 'false'
      TS_HOSTNAME: 5tratumOS
      TS_AUTH_ONCE: 'true'
      TS_BOOT_TIMEOUT: 24h
    volumes:
    - ${APP_DATA_DIR}/data/state:/var/lib/tailscale
    - ${APP_DATA_DIR}/data/run:/var/run/tailscale
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - tailscale --socket=/var/run/tailscale/tailscaled.sock status --json >/dev/null
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    network_mode: host
    cap_add:
    - NET_ADMIN
    - NET_RAW
    devices:
    - /dev/net/tun:/dev/net/tun
    stop_grace_period: 30s
  web:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    restart: unless-stopped
    stop_signal: SIGINT
    entrypoint:
    - /usr/local/bin/tailscale
    command:
    - --socket=/var/run/tailscale/tailscaled.sock
    - web
    - --listen=0.0.0.0:5252
    - --prefix=/apps/tailscale
    ports:
    - 127.0.0.1:33016:5252
    volumes:
    - ${APP_DATA_DIR}/data/run:/var/run/tailscale
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:5252/
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
