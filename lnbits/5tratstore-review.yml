notes: >-
  Lifecycle-tested on the Proxmox 5tratumOS amd64 system. Install, start, pinned
  update, restart, uninstall-with-data-retained, reinstall, health, loopback
  binding, proxy login redirect and clean shutdown passed. The database and
  superuser hashes remained unchanged across update and reinstall. Managed
  state was tightened to mode 0700 directories and 0600 sensitive files. The
  app starts with VoidWallet, reported zero balance, and cannot settle real
  payments until an administrator deliberately configures a funding source.
  A real Lightning backend, encrypted backup/restore, extension isolation,
  upgrade migration, arm64 runtime and independent Sol/high review remain
  tracked follow-up work. The app was disabled after testing.
